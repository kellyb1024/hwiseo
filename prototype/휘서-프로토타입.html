<style>
:root{
  /* Main / Sub / Grayscale — 손생님 레퍼런스식 3층 색 체계 */
  --main:#FFD54A;        /* 노랑 — 사람, 주요 액션 */
  --main-deep:#F5B92E;
  --main-pale:#FFF3CE;
  --sub:#7B5CD6;         /* 보라 — 휘서 */
  --sub-pale:#EDE7FF;
  --mint:#3ECFBB;
  --coral:#FF8A6B;

  --bg:#FFFFFF;
  --cream:#FFFCF4;
  --chrome:rgba(255,255,255,.94);
  --ink:#1D1B22;
  --body:#5D5866;
  --muted:#94909E;
  --dim:#C3BFCC;
  --line:#F0EDE6;

  --sans:-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Segoe UI',system-ui,sans-serif;
  --serif:'Noto Serif KR',serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;

  --shadow-sm:0 2px 10px rgba(93,72,20,.07);
  --shadow-md:0 6px 22px rgba(93,72,20,.10);
  --shadow-btn:0 6px 18px rgba(245,185,46,.34);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--sans);background:#F2EEE6;color:var(--ink);overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
textarea{font:inherit;color:inherit;background:none;border:none;outline:none}

.viewport{min-height:100dvh;display:flex;align-items:center;justify-content:center}
.device{
  width:100%;max-width:430px;height:100dvh;background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden;position:relative;
}
@media (min-width:900px) and (min-height:900px){
  .viewport{padding:32px}
  .device{height:844px;max-width:390px;border-radius:28px;box-shadow:0 20px 70px rgba(80,64,30,.20)}
}

/* ══════ 상태바 자리 ══════ */
/* 폰에서는 OS 상태바가 이 자리를 쓴다 → 요소 자체를 숨기고
   각 화면이 env(safe-area-inset-top) 만큼 여백을 갖는다.
   데스크톱 미리보기에서만 같은 높이의 빈 공간을 만든다. */
.statusbar{display:none}
@media (min-width:900px) and (min-height:900px){
  .statusbar{display:block;flex:0 0 auto;height:44px;background:transparent;position:relative;z-index:20}
  .device .nav{padding-top:8px}
  .device .screen{padding-top:14px}
  .device .pagehead{padding-top:6px}
  .device .pushbanner{top:50px}
  .device .floatback{top:8px}
}

/* ══════ 헤더 ══════ */
.nav{
  flex:0 0 auto;position:relative;background:var(--chrome);
  backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid var(--line);
  padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
  display:flex;align-items:center;gap:11px;
}
.nav .back{font-size:22px;color:var(--ink);line-height:1;padding:2px 4px 2px 0}
.nav .meta{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.nav .nm{font-size:16px;font-weight:700;letter-spacing:-.01em}
.nav .st{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.nav .st i{width:6px;height:6px;border-radius:99px;background:var(--mint);display:block}
.nav .cnt{font-family:var(--mono);font-size:11px;color:var(--dim)}

/* 헤더 아바타 */
.navav{
  width:42px;height:42px;border-radius:50%;background:transparent;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}

/* ══════ 대화 ══════ */
.thread{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:16px 16px 10px;
  display:flex;flex-direction:column;background:var(--cream);
}
.stamp{text-align:center;font-size:11px;color:var(--dim);margin:4px 0 18px;letter-spacing:.01em}
.stamp b{font-weight:600;color:var(--muted)}

.row{display:flex;align-items:flex-end;gap:8px;margin-top:4px}
.row.first{margin-top:14px}
.row.me{justify-content:flex-end}

/* 메시지 옆 아바타 — 대화가 진행될수록 여기 불꽃이 자란다 */
/* 프로필 원 — 배경 없이 캐릭터만 */
.msgav{
  width:32px;height:32px;border-radius:50%;background:transparent;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:1px;
  font-size:13px;font-weight:700;
}
.msgav.blank{background:transparent}

.bubble{
  max-width:74%;padding:11px 16px;
  font-size:16px;line-height:24px;letter-spacing:-.01em;
  border-radius:20px;word-break:break-word;white-space:pre-wrap;
  animation:pop .3s cubic-bezier(.2,.8,.3,1.05) both;
}
.ai .bubble{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm);border-bottom-left-radius:7px}
.me .bubble{background:var(--main);color:#2E2308;box-shadow:var(--shadow-sm);border-bottom-right-radius:7px}
.ai .bubble.mid{border-bottom-left-radius:20px}
.me .bubble.mid{border-bottom-right-radius:20px}

@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.bubble{animation:none}}

.delivered{text-align:right;font-size:11px;color:var(--dim);margin:5px 4px 0}

.dots{display:flex;gap:5px;align-items:center;padding:15px 17px;background:#fff;border-radius:20px;border-bottom-left-radius:7px;box-shadow:var(--shadow-sm)}
.dots i{width:7px;height:7px;border-radius:99px;background:var(--sub);display:block;animation:blink 1.3s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.18s}
.dots i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

.sysline{text-align:center;font-size:13px;color:var(--muted);margin:14px 16px;line-height:1.7}

/* ══════ 입력 ══════ */
.compose{
  flex:0 0 auto;display:flex;gap:9px;align-items:flex-end;
  padding:10px 14px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:var(--chrome);
  backdrop-filter:saturate(180%) blur(18px);
}
.compose .wrap{
  flex:1;display:flex;align-items:center;
  border-radius:22px;background:#F5F2EA;padding:9px 16px;min-height:42px;
  transition:background .16s,box-shadow .16s;
}
.compose .wrap:focus-within{background:#fff;box-shadow:0 0 0 2px var(--main-pale)}
.compose textarea{flex:1;font-size:16px;line-height:24px;resize:none;max-height:104px}
.compose textarea::placeholder{color:var(--dim)}
.send{
  width:42px;height:42px;flex:0 0 auto;border-radius:99px;background:#E9E5DC;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;
  transition:background .18s,transform .12s,box-shadow .18s;
}
.send.on{background:var(--main);color:#2E2308;box-shadow:var(--shadow-btn)}
.send:active{transform:scale(.9)}

/* ══════ 진입 화면 ══════ */
.screen{
  flex:1;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden;
  padding:calc(44px + env(safe-area-inset-top)) 30px calc(30px + env(safe-area-inset-bottom));
}
.screen.center{align-items:center;text-align:center}
.blobs{position:absolute;inset:0;pointer-events:none}

/* 캐릭터 무대 — 부드러운 원 위에 선다 */
.stagechar{
  position:relative;z-index:1;width:100%;display:flex;align-items:center;justify-content:center;
  height:230px;margin-top:8px;
}
/* 캐릭터 뒤 원 — 아주 옅게만 */
.stagechar .ring{
  position:absolute;width:200px;height:200px;border-radius:50%;
  background:var(--sub-pale);opacity:.55;
}
.stagechar img{position:relative;z-index:1}

.title{font-size:27px;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin-top:34px;position:relative;z-index:1}
.brandmark{font-size:44px;font-weight:800;letter-spacing:.04em;position:relative;z-index:1}
.brand-sub{font-family:var(--mono);font-size:11px;letter-spacing:.32em;color:var(--sub);margin-top:11px;position:relative;z-index:1}
.lede{font-size:15px;line-height:27px;color:var(--body);margin-top:14px;white-space:pre-line;position:relative;z-index:1;max-width:290px}

.pagedots{display:flex;gap:7px;justify-content:center;margin-top:26px;position:relative;z-index:1}
.pagedots i{width:7px;height:7px;border-radius:99px;background:#E7E3DA;display:block}
.pagedots i.on{background:var(--main);width:20px}

.lang{display:flex;flex-direction:column;gap:11px;margin-top:38px;width:100%;max-width:262px;position:relative;z-index:1}
.lang button{
  padding:16px;font-size:16px;font-weight:700;border-radius:99px;background:#F5F2EA;color:var(--ink);
  transition:transform .12s,background .16s;
}
.lang button.pri{background:var(--main);box-shadow:var(--shadow-btn)}
.lang button:active{transform:scale(.97)}

.hello{display:flex;flex-direction:column;gap:14px;position:relative;z-index:1;margin-top:26px}
.hello p{font-size:17px;line-height:30px;color:var(--ink)}
.hello p.q{color:var(--body);font-size:16px}

.cta{
  margin-top:auto;width:100%;padding:17px;border-radius:99px;background:var(--main);color:#2E2308;
  font-size:17px;font-weight:700;text-align:center;position:relative;z-index:1;
  box-shadow:var(--shadow-btn);transition:transform .12s;
}
.cta:active{transform:scale(.98)}
.note{font-size:12px;line-height:1.85;color:var(--dim);margin-top:14px;text-align:center;position:relative;z-index:1}
.ghost{
  margin:18px auto 4px;padding:10px 20px;font-size:13px;font-weight:700;color:var(--sub);
  background:var(--sub-pale);border-radius:99px;
}

/* ══════ 이야기 ══════ */
.story-wrap{flex:1;overflow-y:auto;padding:30px 26px;background:var(--cream)}
.story-label{
  display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;
  background:var(--main);color:#2E2308;padding:7px 14px;border-radius:99px;margin-bottom:20px;
}
.storyphoto{width:100%;border-radius:18px;margin-bottom:22px;display:block;box-shadow:var(--shadow-md)}
.oneline{font-size:23px;font-weight:800;line-height:38px;color:var(--ink);margin-bottom:20px;letter-spacing:-.02em}
.story{font-family:var(--serif);font-size:16px;line-height:33px;color:var(--body);white-space:pre-wrap}
.foot{flex:0 0 auto;padding:12px 22px calc(18px + env(safe-area-inset-bottom));background:var(--cream)}

.mockflag{
  flex:0 0 auto;text-align:center;font-family:var(--mono);
  font-size:10px;letter-spacing:.14em;padding:5px;background:var(--sub-pale);color:var(--sub);
}

/* ══════ 개발용 화면 전환기 ══════ */
.devbar{
  position:fixed;left:18px;top:18px;z-index:50;background:#fff;border-radius:16px;
  padding:11px;display:flex;flex-direction:column;gap:3px;min-width:166px;
  font-family:var(--mono);box-shadow:var(--shadow-md);
}
.devbar h6{font-size:9px;letter-spacing:.18em;color:var(--dim);padding:2px 7px 8px;font-weight:400}
.devbar button{text-align:left;font-size:11px;color:var(--body);padding:7px 9px;border-radius:9px;font-family:var(--mono)}
.devbar button:hover{background:#F5F2EA}
.devbar button.on{background:var(--main);color:#2E2308;font-weight:700}
.devbar .k{color:var(--dim);margin-right:7px}
.devtoggle{
  position:fixed;left:18px;top:18px;z-index:50;width:36px;height:36px;border-radius:12px;
  background:#fff;color:var(--sub);font-size:14px;box-shadow:var(--shadow-md);
}
@media (max-width:900px){
  .devbar{left:8px;top:8px;transform:scale(.86);transform-origin:left top}
  .devtoggle{left:8px;top:8px}
}

/* 앱 아이콘(런처)은 public/icon-512.png 에만 노랑 바탕이 있다.
   화면 안에서는 캐릭터를 배경 없이 그대로 쓴다. */

/* ══════ 스플래시 ══════ */
/* 캐릭터를 화면 한가운데 두고, 버튼만 아래에 남긴다 */
.splash{justify-content:flex-start;padding-top:0}
.splash-mid{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;z-index:1;width:100%;
}
.splash-mid .brandmark{margin-top:22px}
.splash .cta{margin-top:0;margin-bottom:6px}

/* ══════ 온보딩 ══════ */
.title{white-space:pre-line;text-align:center}
.textbtn{margin-top:12px;font-size:14px;font-weight:600;color:var(--muted);padding:10px;position:relative;z-index:1}

/* 온보딩 2 — 대화 미리보기 */
.obchat{
  position:relative;z-index:1;width:100%;max-width:300px;margin-top:26px;
  display:flex;flex-direction:column;gap:9px;
}
.obrow{display:flex;align-items:flex-end;gap:7px}
.obrow.me{justify-content:flex-end}
.obav{
  width:28px;height:28px;border-radius:50%;background:transparent;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.obb{
  background:#fff;border-radius:16px;border-bottom-left-radius:6px;padding:9px 14px;
  font-size:14px;line-height:21px;box-shadow:var(--shadow-sm);max-width:84%;text-align:left;
}
.obb.my{background:var(--main);color:#2E2308;border-bottom-left-radius:16px;border-bottom-right-radius:6px}

/* 온보딩 3 — 알림 미리보기 */
.pushpreview{position:relative;z-index:1;width:100%;margin-top:22px}
.freq{display:flex;gap:7px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.chip{
  padding:9px 15px;border-radius:99px;background:#F5F2EA;color:var(--body);
  font-size:13px;font-weight:600;
}
.chip.on{background:var(--sub);color:#fff}

/* ══════ 푸시 배너 ══════ */
.pushbanner{
  position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;z-index:30;
  display:flex;align-items:center;gap:11px;padding:11px 13px;
  background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(22px);
  border-radius:20px;box-shadow:0 8px 30px rgba(60,48,20,.20);
  animation:drop .42s cubic-bezier(.2,.9,.3,1.06) both;cursor:pointer;text-align:left;
}
.pushbanner.static{position:relative;top:0;left:0;right:0;animation:none;cursor:default}
@keyframes drop{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}
.pushicon{flex:0 0 auto}
.pushbody{min-width:0}
.pushbody .pt{font-size:13px;font-weight:700;display:flex;align-items:baseline;gap:7px}
.pushbody .pt span{font-size:11px;font-weight:400;color:var(--muted)}
.pushbody .pb{font-size:13px;line-height:19px;color:var(--body);margin-top:2px}

/* ══════ 홈 ══════ */
.homehead{
  flex:0 0 auto;display:flex;align-items:flex-start;gap:14px;
  padding:calc(26px + env(safe-area-inset-top)) 24px 20px;background:var(--main-pale);
}
.hh-left{flex:1;min-width:0}
.homehead h2{font-size:24px;font-weight:800;line-height:35px;letter-spacing:-.02em;white-space:pre-line}
.hh-char{flex:0 0 auto;width:78px;height:78px;
  display:flex;align-items:center;justify-content:center}

.homebody{flex:1 1 auto;overflow-y:auto;padding:20px 20px calc(24px + env(safe-area-inset-bottom));background:var(--bg)}
.bigcta{
  width:100%;display:flex;align-items:center;justify-content:center;gap:9px;
  padding:19px;border-radius:22px;background:var(--main);color:#2E2308;
  font-size:16px;font-weight:700;box-shadow:var(--shadow-btn);
}
.bigcta .plus{font-size:20px;font-weight:400;line-height:1}
.seclabel{font-size:13px;font-weight:700;color:var(--muted);margin:30px 2px 12px}
.cards{display:flex;flex-direction:column;gap:10px}
.card{
  display:flex;align-items:center;gap:13px;padding:13px;border-radius:18px;
  background:#fff;box-shadow:var(--shadow-sm);text-align:left;width:100%;
  transition:transform .12s;
}
.card:active{transform:scale(.985)}
.card .thumb{width:52px;height:52px;border-radius:13px;flex:0 0 auto}
.card .ctext{display:flex;flex-direction:column;gap:3px;min-width:0}
.card .cd{font-size:11px;color:var(--dim);font-family:var(--mono)}
.card .co{font-size:15px;font-weight:600;line-height:21px;color:var(--ink)}


/* ══════ 온보딩 4 — 이름과 프로필 ══════ */
.bigprof{
  width:104px;height:104px;border-radius:50%;position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;
  font-size:40px;font-weight:800;margin-top:26px;box-shadow:var(--shadow-md);
  transition:background .2s;
}
.nameinput{
  position:relative;z-index:1;width:100%;max-width:280px;margin-top:24px;
  background:#F5F2EA;border-radius:16px;padding:15px 18px;
  font-size:17px;text-align:center;transition:background .16s,box-shadow .16s;
}
.nameinput::placeholder{color:var(--dim)}
.nameinput:focus{background:#fff;box-shadow:0 0 0 2px var(--main)}
.swatches{display:flex;gap:11px;justify-content:center;margin-top:20px;position:relative;z-index:1;flex-wrap:wrap}
.sw{
  width:36px;height:36px;border-radius:50%;transition:transform .14s,box-shadow .14s;
}
.sw.on{transform:scale(1.14);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}

/* 내 프로필 (대화) */
.msgav.me{background:transparent}

/* ══════ 탭 화면 공통 ══════ */
.pagehead{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:calc(20px + env(safe-area-inset-top)) 22px 14px;background:var(--bg);
}
.pagehead h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.hwbtn{width:40px;height:40px;border-radius:50%;background:var(--sub-pale);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.scroll{flex:1 1 auto;overflow-y:auto;padding:6px 20px 24px;background:var(--bg)}
.pagedesc{font-size:14px;line-height:1.7;color:var(--muted);margin:0 2px 16px}

/* ① 대화 목록 */
.rooms{display:flex;flex-direction:column;gap:2px;margin-top:22px}
.room{
  display:flex;align-items:center;gap:13px;padding:13px 12px;border-radius:18px;
  text-align:left;width:100%;transition:background .14s;
}
.room:hover{background:#FAF8F3}
.rthumb{width:52px;height:52px;border-radius:16px;flex:0 0 auto}
.rtext{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.rtop{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rname{font-size:15px;font-weight:700}
.rdate{font-size:11px;color:var(--dim);font-family:var(--mono);flex:0 0 auto}
.rlast{font-size:14px;color:var(--muted);line-height:20px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ② 서랍 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gcard{display:flex;flex-direction:column;text-align:left;background:#fff;
  border-radius:18px;overflow:hidden;box-shadow:var(--shadow-sm);padding-bottom:13px;
  transition:transform .12s}
.gcard:active{transform:scale(.985)}
.gphoto{display:block;width:100%;aspect-ratio:1/1}
.gdate{font-size:10px;font-family:var(--mono);color:var(--dim);margin:11px 13px 4px}
.gone{font-size:14px;font-weight:600;line-height:20px;margin:0 13px;color:var(--ink)}

/* ③ 나 */
.mecard{display:flex;flex-direction:column;align-items:center;background:#fff;
  border-radius:22px;padding:26px 20px;box-shadow:var(--shadow-sm);margin-top:8px}
.bigprof.sm{width:76px;height:76px;font-size:30px;margin-top:0}
.nameinput.inline{margin-top:16px;max-width:220px}
.swatches.sm{margin-top:16px;gap:9px}
.swatches.sm .sw{width:30px;height:30px}
.setcard{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow-sm)}
.setrow{font-size:14px;color:var(--body);margin-bottom:12px}
.freq.left{justify-content:flex-start;margin-top:0}
.setdesc{font-size:13px;line-height:1.75;color:var(--muted);margin-bottom:14px}
.danger{font-size:14px;font-weight:600;color:#E8412F;padding:11px 16px;
  background:#FFF0ED;border-radius:12px;width:100%}

/* 하단 탭 바 */
.tabbar{
  flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:var(--chrome);
  backdrop-filter:saturate(180%) blur(18px);
  padding:8px 0 calc(10px + env(safe-area-inset-bottom));
}
.tabbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--dim);font-size:10px;font-weight:600;padding:4px 0}
.tabbtn.on{color:var(--ink)}
.tabbtn.on svg{color:var(--main-deep)}

/* 휘서 프로필 */
.hwprof{justify-content:flex-start}
.floatback{position:absolute;top:calc(16px + env(safe-area-inset-top));left:16px;z-index:5;
  font-size:24px;color:var(--ink);width:36px;height:36px;border-radius:50%;background:#fff;
  box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center}
.stats{display:flex;gap:12px;margin-top:26px;position:relative;z-index:1;width:100%;max-width:300px}
.stat{flex:1;background:#fff;border-radius:18px;padding:16px 10px;box-shadow:var(--shadow-sm);
  display:flex;flex-direction:column;align-items:center;gap:4px}
.stat b{font-size:21px;font-weight:800}
.stat span{font-size:11px;color:var(--muted)}
.flamebar{width:100%;max-width:300px;height:8px;border-radius:99px;background:#F0EDE6;
  margin-top:14px;position:relative;z-index:1;overflow:hidden}
.flamebar i{display:block;height:100%;background:var(--main);border-radius:99px;transition:width .4s}

/* 단일 HTML 전용 — 폰에서는 프레임 없이 꽉 차게 */
.proto-note{position:fixed;bottom:0;left:0;right:0;z-index:99;background:#1D1B22;color:#FFD54A;
  font:500 11px/1.5 -apple-system,sans-serif;padding:7px 14px;text-align:center;letter-spacing:.01em}
@media (max-width:899px){ .proto-note{display:none} }

<div class="viewport"><div class="device" id="device"></div></div>

<circle cx="332" cy="300" r="8" fill="#FFD54A"/><circle cx="46" cy="96" r="6" fill="#B9A6EF"/>
<circle cx="358" cy="452" r="5" fill="#C9BAF3"/><circle cx="30" cy="426" r="4" fill="#FFD54A"/></svg>`;

const dots = (n,i,tot=4) => '<div class="pagedots">' + Array.from({length:tot},(_,k)=>`<i class="${k===i?'on':''}"></i>`).join('') + '</div>';
const photoSvg = (c) => 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><rect width="800" height="600" fill="${c}"/></svg>`);
const pushText = () => (S.nick.trim() ? S.nick.trim()+'님' : '당신') + '의 이야기를 듣기 위해 기다리고 있어요';
const pushBanner = (cls='') => `<div class="pushbanner ${cls}" ${cls?'':'data-act="closepush"'}>
  <div class="pushicon">${char(38)}</div>
  <div class="pushbody"><div class="pt">휘서<span>지금</span></div><div class="pb">${esc(pushText())}</div></div></div>`;

function bubbles(msgs){
  return msgs.map(([role,text],i)=>{
    const me = role==='me';
    const prev = msgs[i-1], next = msgs[i+1];
    const first = !prev || prev[0]!==role;
    const last = !next || next[0]!==role;
    return `<div class="row ${me?'me':'ai'} ${first?'first':''}">
      ${!me ? `<div class="msgav ${last?'':'blank'}">${last?char(26):''}</div>` : ''}
      <div class="bubble ${last?'':'mid'}">${esc(text)}</div></div>`;
  }).join('');
}

function render(){
  const d = document.getElementById('device');
  let h = statusbar;
  if (S.push) h += pushBanner();

  if (S.stage==='splash') h += `<div class="screen center splash">${blobs}
    <div class="splash-mid">${char(188)}<div class="brandmark">輝敍</div><div class="brand-sub">HWISEO</div></div>
    <button class="cta" data-act="go:ob1">시작하기</button></div>`;

  else if (S.stage==='ob1') h += `<div class="screen center">${blobs}
    <button class="stagechar" data-act="light"><span class="ring"></span>${char(150)}</button>
    ${S.lit
      ? '<div class="title">사진은 있는데,\n이야기는 어디 갔을까요</div><p class="lede">갤러리에 쌓인 사진들은 열리지 않아요.\n휘서가 질문으로 그걸 열어드릴게요.</p>'
      : '<div class="title" style="color:var(--muted);font-size:17px;font-weight:600">초를 눌러 불을 켜주세요</div>'}
    ${dots(4,0)}
    ${S.lit ? '<button class="cta" data-act="go:ob2">다음</button>' : ''}</div>`;

  else if (S.stage==='ob2') h += `<div class="screen center">${blobs}
    <div class="obchat">
      <div class="obrow ai"><div class="obav">${char(24)}</div><div class="obb">어떤 자리였는지 기억나세요?</div></div>
      <div class="obrow me"><div class="obb my">동아리 종강 모임이요</div></div>
      <div class="obrow ai"><div class="obav">${char(24)}</div><div class="obb">사진에 안 찍힌 사람도 있었나요?</div></div>
    </div>
    <div class="title">제가 묻고,\n당신이 답해요</div>
    <p class="lede">저는 사진을 볼 수는 있지만\n그 순간을 겪어보진 못했어요.</p>
    ${dots(4,1)}<button class="cta" data-act="go:name">다음</button></div>`;

  else if (S.stage==='name') h += `<div class="screen center">${blobs}
    <div class="bigprof" style="background:${PROFILES[S.prof][0]};color:${PROFILES[S.prof][1]}">${S.nick.trim()?esc(S.nick.trim()[0]):'?'}</div>
    <div class="title">뭐라고 불러드릴까요?</div>
    <p class="lede">휘서가 대화 중에 이 이름으로 불러요.</p>
    <input class="nameinput" id="nick" value="${esc(S.nick)}" placeholder="이름 또는 별명" maxlength="12">
    <div class="swatches">${PROFILES.map((c,i)=>`<button class="sw ${S.prof===i?'on':''}" style="background:${c[0]}" data-act="prof:${i}"></button>`).join('')}</div>
    ${dots(4,2)}<button class="cta" data-act="go:ob3">다음</button></div>`;

  else if (S.stage==='ob3') h += `<div class="screen center">${blobs}
    <div class="pushpreview">${pushBanner('static')}
      <div class="freq">${['주 1회','2주에 한 번','한 달에 한 번'].map((f,i)=>`<button class="chip ${S.freq===i?'on':''}" data-act="freq:${i}">${f}</button>`).join('')}</div>
    </div>
    <div class="title">일주일에 한 번,\n찾아갈게요</div>
    <p class="lede">편한 시간을 정해두면\n그때 조용히 말을 걸어요.</p>
    ${dots(4,3)}
    <button class="cta" data-act="go:tabs">알림 받기</button>
    <button class="textbtn" data-act="go:tabs">나중에</button></div>`;

  else if (S.stage==='tabs'){
    if (S.tab==='list') h += `<div class="pagehead"><h1>대화</h1>
      <button class="hwbtn" data-act="go:hwiseo">${char(28)}</button></div>
      <div class="scroll"><button class="bigcta" data-act="newchat"><span class="plus">+</span>사진 고르고 시작하기</button>
      <div class="rooms">${[...SESSIONS].reverse().map((a,i)=>`<button class="room" data-act="open:${SESSIONS.length-1-i}">
        <span class="rthumb" style="background:${a.c}"></span>
        <span class="rtext"><span class="rtop"><span class="rname">휘서</span><span class="rdate">${a.d}</span></span>
        <span class="rlast">${esc(a.msgs[a.msgs.length-1][1])}</span></span></button>`).join('')}</div></div>`;
    else if (S.tab==='drawer') h += `<div class="pagehead"><h1>서랍</h1></div>
      <div class="scroll"><p class="pagedesc">지금까지 꺼낸 이야기예요.</p>
      <div class="grid">${[...SESSIONS].reverse().map((a,i)=>`<button class="gcard" data-act="story:${SESSIONS.length-1-i}">
        <span class="gphoto" style="background:${a.c}"></span><span class="gdate">${a.d}</span>
        <span class="gone">${esc(a.o)}</span></button>`).join('')}</div></div>`;
    else h += `<div class="pagehead"><h1>나</h1></div><div class="scroll">
      <div class="mecard"><div class="bigprof sm" style="background:${PROFILES[S.prof][0]};color:${PROFILES[S.prof][1]}">${S.nick.trim()?esc(S.nick.trim()[0]):'?'}</div>
      <input class="nameinput inline" id="nick" value="${esc(S.nick)}" placeholder="이름 또는 별명" maxlength="12">
      <div class="swatches sm">${PROFILES.map((c,i)=>`<button class="sw ${S.prof===i?'on':''}" style="background:${c[0]}" data-act="prof:${i}"></button>`).join('')}</div></div>
      <div class="seclabel">알림</div><div class="setcard"><div class="setrow"><span>휘서가 찾아오는 주기</span></div>
      <div class="freq left">${['주 1회','2주에 한 번','한 달에 한 번'].map((f,i)=>`<button class="chip ${S.freq===i?'on':''}" data-act="freq:${i}">${f}</button>`).join('')}</div></div>
      <div class="seclabel">사진과 데이터</div><div class="setcard">
      <p class="setdesc">올린 사진은 대화가 끝나면 지워지며 저장되지 않습니다. 대화 기록은 이 기기에만 남습니다.</p>
      <button class="danger">모든 기록 지우기</button></div></div>`;

    h += `<nav class="tabbar">
      <button class="tabbtn ${S.tab==='list'?'on':''}" data-act="tab:list"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v10H8l-4 4z"/></svg><span>대화</span></button>
      <button class="tabbtn ${S.tab==='drawer'?'on':''}" data-act="tab:drawer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v6H4zM4 13h16v6H4z"/></svg><span>서랍</span></button>
      <button class="tabbtn ${S.tab==='me'?'on':''}" data-act="tab:me"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zM4 20c0-3.3 3.6-6 8-6s8 2.7 8 6"/></svg><span>나</span></button>
    </nav>`;
  }

  else if (S.stage==='hwiseo') h += `<div class="screen center hwprof">
    <button class="floatback" data-act="go:tabs">‹</button>${blobs}
    <div class="stagechar" style="height:210px"><span class="ring"></span>${char(158)}</div>
    <div class="title" style="margin-top:20px">휘서</div>
    <p class="lede">기억을 다시 꺼내는 걸 돕는 초.\n사진은 볼 수 있지만 그 순간을 겪지는 못했어요.</p>
    <div class="stats"><div class="stat"><b>${SESSIONS.length}</b><span>함께 꺼낸 이야기</span></div>
    <div class="stat"><b>3 / 4</b><span>불꽃</span></div></div>
    <div class="flamebar"><i style="width:75%"></i></div></div>`;

  else if (S.stage==='chat') h += `<div class="nav"><button class="back" data-act="go:tabs">‹</button>
    <div class="navav">${char(38)}</div>
    <div class="meta"><div class="nm">휘서</div><div class="st"><i></i>${S.busy?'듣는 중':'HWISEO'}</div></div></div>
    <div class="thread" id="thread"><div class="stamp"><b>오늘</b> 오후 9:41</div>
    ${bubbles(S.msgs)}
    ${S.busy?'<div class="row ai first"><div class="msgav">'+char(26)+'</div><div class="dots"><i></i><i></i><i></i></div></div>':''}
    ${(!S.busy && S.msgs.length && S.msgs[S.msgs.length-1][0]==='me')?'<div class="delivered">전달됨</div>':''}
    ${(!S.busy && S.step>=SCRIPT_MSGS.length)?'<button class="ghost" data-act="tostory">이야기로 정리하기</button>':''}
    </div>
    <div class="compose"><div class="wrap"><textarea rows="1" id="ta" placeholder="메시지"></textarea></div>
    <button class="send" id="send" data-act="send">↑</button></div>`;

  else if (S.stage==='story') h += `<div class="story-wrap">
    <div class="story-label">${char(15)}오늘의 이야기</div>
    <img class="storyphoto" src="${photoSvg(S.photo||'#B99B76')}" alt="">
    <div class="oneline">${esc(S.storyData?.oneline||STORY.oneline)}</div>
    <div class="story">${esc(S.storyData?.story||STORY.story)}</div>
    <p class="note" style="text-align:left">올린 사진은 대화가 끝나면 지워지며 저장되지 않습니다.</p></div>
    <div class="foot"><button class="cta" style="margin-top:0" data-act="go:tabs">다른 사진으로 다시</button></div>`;

  d.innerHTML = h;
  const th = document.getElementById('thread'); if (th) th.scrollTop = th.scrollHeight;
  const ta = document.getElementById('ta');
  if (ta) {
    ta.addEventListener('input', () => {
      document.getElementById('send').classList.toggle('on', !!ta.value.trim());
      ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,104)+'px';
    });
    ta.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); act('send'); } });
  }
  const nk = document.getElementById('nick');
  if (nk) nk.addEventListener('input', e => {
    S.nick = e.target.value;
    const bp = document.querySelector('.bigprof'); if (bp) bp.textContent = S.nick.trim() ? S.nick.trim()[0] : '?';
  });
}

function advance(){
  if (S.step >= SCRIPT_MSGS.length) return;
  S.busy = true; render();
  setTimeout(() => {
    S.msgs.push(SCRIPT_MSGS[S.step]); S.step++;
    S.busy = false; render();
  }, 900);
}

function act(a){
  const [k,v] = a.split(':');
  if (k==='go'){ S.push=false; if(v==='tabs'){S.tab='list';S.stage='tabs';} else S.stage=v; }
  else if (k==='light'){ S.lit=true; }
  else if (k==='prof'){ S.prof=+v; }
  else if (k==='freq'){ S.freq=+v; }
  else if (k==='tab'){ S.tab=v; }
  else if (k==='closepush'){ S.push=false; S.tab='list'; S.stage='tabs'; }
  else if (k==='newchat'){ S.msgs=[]; S.step=0; S.photo='#B99B76'; S.storyData=null; S.stage='chat'; render(); advance(); return; }
  else if (k==='open'){ const a2=SESSIONS[+v]; S.msgs=a2.msgs.slice(); S.step=SCRIPT_MSGS.length; S.photo=a2.c; S.stage='chat'; }
  else if (k==='story'){ const a2=SESSIONS[+v]; S.photo=a2.c; S.storyData={oneline:a2.o, story:STORY.story}; S.stage='story'; }
  else if (k==='tostory'){ S.storyData=null; S.stage='story'; }
  else if (k==='send'){
    const ta=document.getElementById('ta'); const txt=ta?.value.trim();
    if(!txt||S.busy) return;
    S.msgs.push(['me',txt]);
    if (S.step<SCRIPT_MSGS.length && SCRIPT_MSGS[S.step][0]==='me') S.step++;
    render(); advance(); return;
  }
  render();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b) act(b.dataset.act);
});
render();
</script>
</body>
</html>
