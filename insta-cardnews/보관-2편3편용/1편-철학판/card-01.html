<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>휘서 카드뉴스 01</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<script src="../design/character/hwiseo-F.js"></script>
<style>
:root{--purple:#765DCF;--yellow:#F8D764;--ink:#2B2233;--paper:#FBF8F1;--grid:#E9E3F3}
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;background:var(--paper)}
.card{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:Pretendard,sans-serif;color:var(--ink);
  background:
    linear-gradient(var(--grid) 2px,transparent 2px) 0 0/54px 54px,
    linear-gradient(90deg,var(--grid) 2px,transparent 2px) 0 0/54px 54px,var(--paper)}
.pen{font-family:'Nanum Pen Script',cursive}
/* 상단 라벨 */
.tag{position:absolute;left:84px;top:92px;display:flex;gap:14px;align-items:center}
.chip{background:var(--purple);color:#fff;font-weight:700;font-size:30px;padding:10px 22px;border-radius:999px}
.chip.o{background:transparent;color:var(--purple);border:3px solid var(--purple)}
.page{position:absolute;right:84px;top:100px;font-size:46px;color:var(--purple)}
/* 제목 */
.series{position:absolute;left:84px;top:110px;background:var(--purple);color:#fff;font-weight:700;font-size:32px;padding:10px 24px;border-radius:999px}
.title{position:absolute;left:84px;top:130px;font-weight:800;font-size:118px;line-height:1.14;letter-spacing:-4px;word-break:keep-all}
.hl{position:relative;display:inline-block;z-index:0}
.hl::after{content:"";position:absolute;left:-8px;right:-10px;bottom:10px;height:44px;background:var(--yellow);z-index:-1;transform:rotate(-1.5deg);border-radius:6px}
.p{color:var(--purple)}
.sub{position:absolute;left:88px;top:470px;font-size:40px;line-height:1.5;font-weight:500;color:#5A5066;word-break:keep-all}
/* 폴라로이드 + 캐릭터 */
.polaroid{position:absolute;left:330px;top:670px;width:520px;height:520px;background:#fff;padding:26px 26px 90px;
  box-shadow:0 18px 40px rgba(60,40,90,.16);transform:rotate(4deg)}
.polaroid .shot{width:100%;height:100%;background:var(--purple);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.polaroid .shot svg{width:112%;height:112%;margin-bottom:-6%}
.polaroid .cap{position:absolute;left:0;right:0;bottom:18px;text-align:center;font-size:52px;color:var(--ink)}
.tape{position:absolute;width:190px;height:54px;background:rgba(248,215,100,.82);top:-24px;left:50%;transform:translateX(-50%) rotate(-5deg)}
/* 낙서 메모 */
.memo{position:absolute;left:92px;top:760px;font-size:58px;line-height:1.1;color:var(--purple);transform:rotate(-6deg)}
.arrow{position:absolute;left:170px;top:890px}
.memo2{position:absolute;z-index:3;right:40px;top:560px;font-size:46px;color:#8B8098;transform:rotate(5deg);text-align:right}
/* 하단 */
.swipe{position:absolute;right:84px;bottom:74px;font-size:50px;color:var(--purple)}
.foot{position:absolute;left:84px;bottom:82px;font-size:28px;font-weight:600;color:#9A90A6;letter-spacing:.5px}
</style></head><body>
<div class="card">

  <h1 class="title">AI 친구 <span class="p">휘서</span>가<br><span class="hl">태어나기까지</span></h1>
  <p class="sub">졸업작품으로 왜 AI 친구를 만들게 됐는지,<br>제 생각부터 먼저 풀어볼게요</p>

  <div class="memo2 pen">(구버전 휘서는<br>2편에서 몰래 공개..)</div>

  <div class="memo pen">얘가<br>휘서예요!</div>
  <svg class="arrow" width="180" height="120" viewBox="0 0 180 120" fill="none" stroke="#765DCF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10,12 C40,70 100,96 160,88"/><path d="M136,70 L162,88 L134,104"/>
  </svg>

  <div class="polaroid">
    <div class="tape"></div>
    <div class="shot" id="shot"></div>
    <div class="cap pen">양초 휘서, 9월 버전</div>
  </div>

  <div class="foot">연세대학교 IID 전공 졸업전시 2026</div>
</div>
<script>
document.getElementById('shot').innerHTML = `<style>${HWF.CSS}</style>` + HWF.char({pose:'idle',level:3,mood:'neutral'});
</script>
</body></html>
