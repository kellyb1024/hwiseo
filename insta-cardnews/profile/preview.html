<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><style>
*{margin:0}body{width:1500px;height:620px;background:#fff;font-family:Pretendard;display:flex;gap:60px;justify-content:center;align-items:center}
.i{text-align:center}.r{width:400px;height:400px;border-radius:50%;padding:10px;background:conic-gradient(#F9CE34,#EE2A7B,#6228D7,#F9CE34)}
.r div{width:100%;height:100%;border-radius:50%;border:8px solid #fff;box-sizing:border-box;overflow:hidden}.r img{width:100%;height:100%;display:block}
.s{margin-top:20px;display:flex;gap:18px;justify-content:center;align-items:center}.s img{width:56px;height:56px;border-radius:50%}.s .t{width:32px;height:32px}
b{display:block;margin-top:14px;font-size:30px}</style></head><body>
<div class="i"><div class="r"><div><img src="profile-A.png"></div></div><div class="s"><img src="profile-A.png"><img class="t" src="profile-A.png"></div><b>A 클로즈업 + 양손</b></div>
<div class="i"><div class="r"><div><img src="profile-B.png"></div></div><div class="s"><img src="profile-B.png"><img class="t" src="profile-B.png"></div><b>B 불꽃 강조</b></div>
<div class="i"><div class="r"><div><img src="profile-C.png"></div></div><div class="s"><img src="profile-C.png"><img class="t" src="profile-C.png"></div><b>C 윙크</b></div>
</body></html>
