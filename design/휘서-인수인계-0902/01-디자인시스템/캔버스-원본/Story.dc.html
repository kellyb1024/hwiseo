      <circle cx="70" cy="50" r="6" fill="#FFDCA8"/>

  </div>

  </div>

        <svg viewBox="0 0 80 60" width="66" fill="none" stroke="#E9A24A" stroke-opacity="0.45" stroke-width="1.1" stroke-linecap="round"><path d="M12 44 q14 -12 28 0 q14 12 28 0"/><path d="M12 30 q14 -12 28 0 q14 12 28 0" stroke-opacity="0.3"/></svg>

        <svg viewBox="0 0 80 60" width="66" fill="none" stroke="#E9A24A" stroke-opacity="0.45" stroke-width="1.1" stroke-linecap="round"><circle cx="40" cy="34" r="4" fill="#E9A24A" fill-opacity="0.5" stroke="none"/><path d="M24 28 q16 -14 32 0"/><path d="M14 34 q26 -24 52 0" stroke-opacity="0.3"/></svg>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; gap: 9px; position: relative;">
    <div style="flex-grow: 1; text-align: center; border: 1px solid rgba(233,162,74,0.45); color: #E9A24A; border-radius: 24px; padding: 15px 0; font-size: 13px; font-weight: 500;">간직하기</div>
    <div style="flex-grow: 1; text-align: center; border: 1px solid rgba(239,234,242,0.16); color: #B7ADC4; border-radius: 24px; padding: 15px 0; font-size: 13px;">누군가에게 보내기</div>
  </div>

  <div style="font-size: 11px; color: #5C5468; text-align: center; line-height: 1.7; position: relative;">1년 뒤 오늘, 이 이야기가 다시 도착합니다</div>

</div>
</x-dc>
</body>
</html>
