<!doctype html><meta charset="utf-8"><style>body{background:#F8F5F0;margin:0;padding:30px;font-family:sans-serif;display:flex;gap:30px;align-items:flex-start}figure{margin:0;text-align:center;font-size:12px;color:#666}img{display:block}svg{display:block}.ov{position:relative;width:326px;height:503px}.ov img,.ov svg{position:absolute;left:0;top:0}</style>
<figure><img src="ref24.png" width="326" height="503"><figcaption>레퍼 24 (×1.36)</figcaption></figure>
<figure><div id="a"></div><figcaption>F 지금</figcaption></figure>
<figure><div class="ov"><img src="ref24.png" width="326" height="503" style="opacity:.55"><div id="b"></div></div><figcaption>겹쳐 보기 (레퍼 55%)</figcaption></figure>
<script src="hwiseo-F.js"></script><script>
// 레퍼 몸 x34~197(폭163), 캡 윗선 y82 · ×1.36 → 화면에서 몸 폭 221.7, 캡 위 111.5, 몸 왼쪽 46.2
// F 는 몸 x60~240(폭180), 캡 위 y120 → scale=221.7/180=1.2317, 좌표 오프셋: 화면x = 46.2 + (x-60)*1.2317, 화면y = 111.5 + (y-120)*1.2317
const sc=1.2317, ox=46.2-60*sc, oy=111.5-120*sc;
const mk=()=>HWF.char({level:3,mood:'neutral',lids:false,vb:'0 0 300 340'}).replace('<svg ',`<svg width="${300*sc}" height="${340*sc}" style="position:absolute;left:${ox}px;top:${oy}px" `);
document.getElementById('b').innerHTML=mk();
document.getElementById('a').innerHTML=HWF.char({level:3,mood:'neutral',lids:false}).replace('<svg ','<svg width="326" height="370" ');
</script>
