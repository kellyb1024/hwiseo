<!doctype html><meta charset="utf-8"><title>휘서 OLD — 지치고 늙은 휘서 (번외 · 인스타 프로필)</title>
<style>
 body{background:#FAF6EE;margin:0;padding:26px 32px;font-family:-apple-system,Pretendard,'Apple SD Gothic Neo',sans-serif;color:#2E2418}
 h1{font-size:26px;margin:0 0 4px}h2{font-size:15px;margin:34px 0 12px;border-bottom:1.5px solid #E5DCC8;padding-bottom:7px}
 p.n{font-size:13px;color:#6F6A78;margin:0 0 4px;line-height:1.7}
 .grid{display:flex;flex-wrap:wrap;gap:10px}
 figure{margin:0;text-align:center;font-size:12px;font-weight:700}
 figure .c{width:180px;height:180px;border-radius:50%;overflow:hidden;display:grid;place-items:center}
 figure svg{width:100%;display:block}
 .sizes{display:flex;gap:12px;align-items:center;margin:10px 0 0}
 .sizes .c{border-radius:50%;overflow:hidden;display:grid;place-items:center;flex:none}
 .bgs{display:flex;gap:10px}
</style>
<h1>지치고 늙은 휘서 <span style="font-size:14px;font-weight:400;color:#6F6A78">— 번외, 인스타 프로필용</span></h1>
<p class="n">"늙음"을 나이가 아니라 <b>오래 탄 것</b>으로 잡았습니다. 몸이 짧아지고 · 심지가 길고 굽고 · 불꽃이 작아집니다.
촛농은 손대지 않았습니다(기본 base · 웅덩이 없음). 앱 캐릭터 <code>hwiseo-F.js</code>는 그대로이고, 이 파일만 따로 조립합니다.</p>
<h2>안 고르기 — 원형 크롭</h2><div class="grid" id="v"></div>
<h2>작은 크기에서 (실제 픽셀 그대로 — 160 / 피드 110 / 스토리 64 / 댓글 40)</h2><div id="s"></div>
<h2>배경색</h2><div class="bgs" id="b"></div>
<script src="hwiseo-F.js"></script><script src="hwiseo-old.js"></script><script>
document.head.insertAdjacentHTML('beforeend','<style>'+HWF.CSS+HWOLD.CSS+'</style>');
const C=HWOLD.CROP, BG='#765DCF';
const V=[[{},'A 기본'],[{gear:['glasses']},'B 안경'],[{gear:['beard']},'C 수염'],[{gear:['glasses','beard']},'D 안경+수염'],
 [{face:'calm',gear:['glasses']},'E 안경 · 옅은 미소'],[{face:'sigh'},'F 한숨'],[{k:.6,gear:['glasses']},'G 더 탄 초 + 안경']];
v.innerHTML=V.map(([c,l])=>`<figure><div class="c" style="background:${BG}">${HWOLD.old({...c,vb:C})}</div><figcaption>${l}</figcaption></figure>`).join('');
s.innerHTML=V.map(([c,l])=>`<div class="sizes">${[160,110,64,40].map(w=>`<div class="c" style="width:${w}px;height:${w}px;background:${BG}">${HWOLD.old({...c,vb:C})}</div>`).join('')}<span style="font-size:12px">${l}</span></div>`).join('');
b.innerHTML=['#765DCF','#5B44A8','#F8D764','#FAF6EE','#2E2418'].map(bg=>`<figure><div class="c" style="background:${bg}">${HWOLD.old({gear:['glasses'],vb:C})}</div><figcaption>${bg}</figcaption></figure>`).join('');
</script>
